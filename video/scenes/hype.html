<!doctype html>
<html><head><meta charset="utf-8">
<title>Tremor Mesh hype scenes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Atkinson+Hyperlegible+Next:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Tremor Mesh submission video, v2 "hype" cut. Every frame is a pure function of t (seconds), rendered by the
// demo-video skill's frames.mjs at 60 fps. Scene by URL hash. Numbers are real (recorded dataset, EXP-0004).
const W = 1920, H = 1080;
const OUT = document.getElementById("c").getContext("2d");
const mk = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };
const L = mk(), g = L.getContext("2d"), RC = mk(), rg = RC.getContext("2d"), CC = mk(), cg = CC.getContext("2d");
const RED = "#ff3347", INK = "#f5f5f3", DIM = "#7a7a7a", MUTE = "#bdbdbd", BG = "#050505";
const HY = '"Anton", Impact, sans-serif', MONO = '"JetBrains Mono", monospace', SANS = '"Atkinson Hyperlegible Next", sans-serif';
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ss = (a, b, t) => { const x = cl((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const eo = (x) => 1 - Math.pow(1 - cl(x), 3);
const eob = (x) => { x = cl(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const imp = (t, arr) => arr.reduce((a, [ti, s = 1]) => (t >= ti ? a + s * Math.exp(-(t - ti) * 9) : a), 0);

// ---------- post: shake, zoom, rgb split, glitch slices, flashes, crt squash, scanlines, grain, vignette
const SCAN = mk(); { const s = SCAN.getContext("2d"); s.fillStyle = "rgba(0,0,0,.18)"; for (let y = 0; y < H; y += 4) s.fillRect(0, y, W, 2); }
const VIG = mk(); { const v = VIG.getContext("2d"); const gr = v.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.0); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,.8)"); v.fillStyle = gr; v.fillRect(0, 0, W, H); }
const GRAIN = [0, 1, 2, 3].map((k) => { const c = document.createElement("canvas"); c.width = 480; c.height = 270; const x = c.getContext("2d"), im = x.createImageData(480, 270); for (let i = 0; i < 480 * 270; i++) { const v = hash(i * 0.731 + k * 91.3) * 255; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; } x.putImageData(im, 0, 0); return c; });
function tint(cx, col) { cx.globalCompositeOperation = "source-over"; cx.drawImage(L, 0, 0); cx.globalCompositeOperation = "multiply"; cx.fillStyle = col; cx.fillRect(0, 0, W, H); cx.globalCompositeOperation = "source-over"; }
function post(t, fx = {}) {
  const f = Math.floor(t * 60);
  OUT.save(); OUT.fillStyle = "#000"; OUT.fillRect(0, 0, W, H);
  const sh = fx.shake ?? 0, sx = (hash(f * 1.31) - 0.5) * 2 * sh, sy = (hash(f * 2.71 + 5) - 0.5) * 2 * sh;
  const z = fx.zoom ?? 1;
  OUT.translate(W / 2 + sx, H / 2 + sy); OUT.rotate(fx.rot ?? 0); OUT.scale(z, z * (fx.sy ?? 1)); OUT.translate(-W / 2, -H / 2);
  const d = fx.rgb ?? 0;
  if (d > 0.6) { tint(rg, "#ff0000"); tint(cg, "#00ffff"); OUT.globalCompositeOperation = "lighter"; OUT.drawImage(RC, d, 0); OUT.drawImage(CC, -d, 0); OUT.globalCompositeOperation = "source-over"; }
  else OUT.drawImage(L, 0, 0);
  OUT.restore();
  const gl = fx.glitch ?? 0;
  if (gl > 0.02) { const fr = Math.floor(t * 24); for (let i = 0; i < 14; i++) { if (hash(fr * 7.1 + i) > gl) continue; const y = Math.floor(hash(i * 3.1 + fr) * H), h = 6 + Math.floor(hash(i + fr * 1.7) * 70), off = (hash(i * 9.7 + fr) - 0.5) * 220 * gl; OUT.drawImage(OUT.canvas, 0, y, W, h, off, y, W, h); } }
  if ((fx.flash ?? 0) > 0.01) { OUT.fillStyle = `rgba(255,255,255,${cl(fx.flash)})`; OUT.fillRect(0, 0, W, H); }
  if ((fx.red ?? 0) > 0.01) { OUT.fillStyle = `rgba(255,51,71,${cl(fx.red)})`; OUT.fillRect(0, 0, W, H); }
  if ((fx.black ?? 0) > 0.01) { OUT.fillStyle = `rgba(0,0,0,${cl(fx.black)})`; OUT.fillRect(0, 0, W, H); }
  OUT.drawImage(SCAN, 0, 0);
  OUT.imageSmoothingEnabled = false; OUT.globalAlpha = 0.06; OUT.drawImage(GRAIN[Math.floor(t * 24) % 4], 0, 0, W, H); OUT.globalAlpha = 1; OUT.imageSmoothingEnabled = true;
  OUT.drawImage(VIG, 0, 0);
}
function fxOf(t, hits, extra = {}) { const i = imp(t, hits); return { shake: i * 26, rgb: 2 + i * 16, glitch: cl(i * 0.5), flash: 0, ...extra }; }

// ---------- drawing helpers (on layer g)
function clear() { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = BG; g.fillRect(0, 0, W, H); }
function T(s, x, y, o = {}) {
  g.save(); g.globalAlpha = o.a ?? 1; g.fillStyle = o.col ?? INK; g.font = `${o.w ?? 400} ${o.size ?? 40}px ${o.f ?? HY}`;
  g.textAlign = o.align ?? "center"; g.textBaseline = o.base ?? "middle"; if (o.ls) g.letterSpacing = o.ls + "px";
  if (o.glow) { g.shadowColor = o.col ?? INK; g.shadowBlur = o.glow; }
  g.fillText(s, x, y); g.restore();
}
// slam: word crashes in from big, ghost trails, settles; exits by blowing past the camera
function slam(s, x, y, t, t0, t1, o = {}) {
  if (t < t0 || t > t1) return; const a = t - t0, k = cl(a / 0.2), out = ss(t1 - 0.22, t1, t);
  const sc = (a < 0.2 ? lerp(o.from ?? 3.2, 1, eo(k)) : 1 + (a - 0.2) * 0.025) * (1 + out * 1.8);
  const al = k * (1 - out);
  for (let gh = 2; gh >= 0; gh--) {
    const gs = gh === 0 ? 1 : 1 + gh * 0.06 * (1 - k * 0.7);
    g.save(); g.translate(x, y); g.rotate(o.rot ?? 0); g.scale(sc * gs, sc * gs);
    T(s, 0, 0, { ...o, a: al * (gh === 0 ? 1 : 0.18), glow: gh === 0 ? o.glow : 0 }); g.restore();
  }
}
function line(x1, y1, x2, y2, col, lw = 2, a = 1, dash) { g.save(); g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = lw; if (dash) g.setLineDash(dash); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore(); }
function circ(x, y, r, o = {}) { if (r <= 0) return; g.save(); g.globalAlpha = o.a ?? 1; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); if (o.glow) { g.shadowColor = o.fill ?? o.stroke; g.shadowBlur = o.glow; } if (o.fill) { g.fillStyle = o.fill; g.fill(); } if (o.stroke) { g.lineWidth = o.lw ?? 2; g.strokeStyle = o.stroke; if (o.dash) g.setLineDash(o.dash); g.stroke(); } g.restore(); }
function rect(x, y, w, h, o = {}) { g.save(); g.globalAlpha = o.a ?? 1; g.beginPath(); g.roundRect(x, y, w, h, o.r ?? 0); if (o.glow) { g.shadowColor = o.stroke ?? o.fill; g.shadowBlur = o.glow; } if (o.fill) { g.fillStyle = o.fill; g.fill(); } if (o.stroke) { g.lineWidth = o.lw ?? 2; g.strokeStyle = o.stroke; g.stroke(); } g.restore(); }
// 3D camera: y up
function cam(yaw, pitch, dist, fov, target = [0, 0, 0], cx = W / 2, cy = H / 2) { return { cyw: Math.cos(yaw), syw: Math.sin(yaw), cp: Math.cos(pitch), sp: Math.sin(pitch), dist, fov, target, cx, cy }; }
function P(c, x, y, z) {
  x -= c.target[0]; y -= c.target[1]; z -= c.target[2];
  const X = x * c.cyw - z * c.syw; let Z = x * c.syw + z * c.cyw; const Y = y * c.cp - Z * c.sp; Z = y * c.sp + Z * c.cp + c.dist;
  if (Z < 20) return null; const s = c.fov / Z; return { x: c.cx + X * s, y: c.cy - Y * s, s, z: Z };
}
function L3(c, a, b, col, lw = 2, al = 1) { const p = P(c, ...a), q = P(c, ...b); if (p && q) line(p.x, p.y, q.x, q.y, col, lw, al); }
function poly3(c, pts, col, lw, al) { g.save(); g.globalAlpha = al; g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); let st = false; for (const p0 of pts) { const p = P(c, ...p0); if (!p) { st = false; continue; } st ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); st = true; } g.stroke(); g.restore(); }
// seismograph traces flying past at depth (background motif)
function traces(t, n, col = "#2a2a2a", speed = 1) {
  for (let i = 0; i < n; i++) {
    const z = ((i * 173 + t * 300 * speed) % 2400) + 80, s = 700 / z, yb = H / 2 + (hash(i) - 0.5) * 2400 * s, a = cl(1 - z / 2400) * 0.9;
    g.save(); g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = Math.max(1, 3 * s); g.beginPath();
    for (let x = 0; x <= W; x += 12) { const u = (x - W / 2) / s * 0.01 + t * 6 + i; const y = yb + Math.sin(u) * 30 * s * (1 + Math.sin(u * 0.37) * 0.8) + Math.sin(u * 3.3) * 8 * s; x ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke(); g.restore();
  }
}
function shards(t, t0, n, cx, cy, seed, col = INK, spd = 1) {
  if (t < t0) return; const a = t - t0; if (a > 2.5) return;
  for (let i = 0; i < n; i++) {
    const ang = hash(seed + i) * Math.PI * 2, v = (300 + hash(seed + i * 2.1) * 1400) * spd, r = v * a - 300 * a * a * 0;
    const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r + 400 * a * a, s = 6 + hash(i + seed) * 26;
    g.save(); g.translate(x, y); g.rotate(a * (hash(i * 5 + seed) - 0.5) * 18); g.globalAlpha = cl(1 - a / 2.2); g.fillStyle = col; g.fillRect(-s / 2, -s / 6, s, s / 3); g.restore();
  }
}

// ============================================================ scenes
const S = {};

// 1. NEWS: three real stories fly at the camera, then the quote that started it
S.news = { dur: 14, draw(t) {
  clear(); traces(t, 26, "#262626", 1.4);
  const cards = [
    { src: "THE ASIAN AGE · OCT 2017", h: ["METRO VIBRATIONS", "“BELOW THE LIMIT”"], sub: "MMRC on residents’ phone readings: “can’t be that accurate.”" },
    { src: "FREE PRESS JOURNAL · 23 MAY 2025", h: ["HERITAGE WALL CRACKS", "NEAR GATEWAY OF INDIA"], sub: "Colaba residents demand real-time vibration data shared with them." },
    { src: "MUMBAI LIVE · SUPREME COURT", h: ["MAHIM BUILDINGS TILT.", "COURT ASKS FOR TREMORS."], sub: "MMRCL directed to file details of any tremors." },
  ];
  const hits = [[10.3, 1.6], [10.55, 1.2], [12.4, 1.4]];
  cards.forEach((c, i) => {
    const t0 = 0.2 + i * 3.35, u = t - t0; if (u < 0 || u > 3.35) return;
    hits.push([t0 + 0.45, 0.9]);
    const side = i % 2 ? -1 : 1;
    let sc, rot, al = 1;
    if (u < 0.5) { const k = eob(u / 0.5); sc = lerp(0.04, 1, k); rot = lerp(side * 0.9, side * 0.035, eo(u / 0.5)); al = cl(u / 0.15); }
    else if (u < 2.95) { sc = 1 + (u - 0.5) * 0.05; rot = side * 0.035 - (u - 0.5) * side * 0.01; }
    else { const k = (u - 2.95) / 0.4; sc = 1.12 + k * k * 7; rot = side * 0.01; al = 1 - k; }
    g.save(); g.translate(W / 2, H / 2); g.rotate(rot); g.transform(1, 0, side * -0.06, 1, 0, 0); g.scale(sc, sc); g.globalAlpha = al;
    rect(-560, -300, 1120, 600, { fill: "#0e0e0e", stroke: "#3a3a3a", lw: 2, a: al });
    rect(-560, -300, 14, 600, { fill: i === 0 ? RED : INK, a: al });
    T(c.src, -500, -230, { f: MONO, w: 700, size: 24, col: DIM, align: "left", a: al, ls: 2 });
    c.h.forEach((ln, j) => T(ln, -500, -110 + j * 112, { size: 104, align: "left", a: al }));
    T(c.sub, -500, 190, { f: SANS, w: 700, size: 32, col: i === 0 ? RED : MUTE, align: "left", a: al });
    g.restore();
  });
  shards(t, 10.25, 90, W / 2, H / 2, 11);
  slam("“CAN’T BE THAT", W / 2, H / 2 - 120, t, 10.3, 12.25, { size: 210, col: RED, glow: 30 });
  slam("ACCURATE.”", W / 2, H / 2 + 110, t, 10.55, 12.25, { size: 210, col: RED, glow: 30 });
  if (t > 11 && t < 12.25) T("— MMRC, on residents’ phone readings, 2017", W / 2, H / 2 + 300, { f: MONO, w: 700, size: 26, col: MUTE, a: ss(11, 11.3, t) * (1 - ss(12, 12.25, t)) });
  slam("CHALLENGE", W / 2, H / 2 - 100, t, 12.4, 14.1, { size: 230 });
  slam("ACCEPTED.", W / 2, H / 2 + 120, t, 12.62, 14.1, { size: 230, col: RED, glow: 40 });
  return fxOf(t, hits, { flash: imp(t, [[12.4, 0.5]]), zoom: 1 + imp(t, [[10.3, 0.05], [12.4, 0.05]]) });
}};

// 2. IDEA: a building assembles in 3D, one phone per flat; the quake rolls in; every flat signs
S.idea = { dur: 15, draw(t) {
  clear();
  const q = ss(8.4, 8.6, t) * (1 - ss(10.6, 12.2, t));
  const c = cam(0.55 + t * 0.22, 0.32 + Math.sin(t * 0.4) * 0.05, 1950 - ss(2.4, 6, t) * 250, 1500, [0, 380, 0], W / 2, H * 0.6);
  // ground grid with shockwave
  const wave = (x, z) => { if (t < 8.45) return 0; const r = Math.hypot(x, z), a = t - 8.45, f = r - 1100 * a; return 90 * Math.exp(-f * f / (2 * 110 * 110)) * Math.exp(-a * 0.5) * Math.cos(f * 0.03); };
  const gA = ss(1.6, 2.6, t);
  for (let i = -12; i <= 12; i++) { const a = [], b = []; for (let j = -12; j <= 12; j++) { a.push([i * 100, wave(i * 100, j * 100), j * 100]); b.push([j * 100, wave(j * 100, i * 100), i * 100]); } poly3(c, a, q > 0.05 ? "#5a2027" : "#262626", 1.5, gA); poly3(c, b, q > 0.05 ? "#5a2027" : "#262626", 1.5, gA); }
  const FL = 6, FH = 120, X = 220, Z = 110;
  const sway = (y) => Math.sin(t * 16) * q * y * 0.09;
  for (let f = 0; f <= FL; f++) {
    const k = ss(2.6 + f * 0.33, 2.95 + f * 0.33, t); if (k <= 0) continue;
    const y = f * FH * eo(k) + (1 - eo(k)) * -200, s = sway(y);
    const rc = [[-X + s, y, -Z], [X + s, y, -Z], [X + s, y, Z], [-X + s, y, Z], [-X + s, y, -Z]];
    poly3(c, rc, INK, f === 0 || f === FL ? 3 : 2, k * 0.9);
    if (f < FL) { [[-X, -Z], [X, -Z], [X, Z], [-X, Z]].forEach(([x, z]) => L3(c, [x + s, y, z], [x + sway(y + FH), y + FH * eo(k), z], "#8a8a8a", 2, k * 0.8)); for (let i = 1; i < 4; i++) L3(c, [-X + i * 110 + s, y, -Z], [-X + i * 110 + s, y, Z], "#3a3a3a", 1.5, k); L3(c, [-X + s, y, 0], [X + s, y, 0], "#3a3a3a", 1.5, k); }
  }
  // phones: one per flat
  for (let f = 0; f < FL; f++) for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) {
    const id = f * 8 + i * 2 + j, on = 5 + hash(id) * 2.2, sg = 9.0 + hash(id + 40) * 1.6;
    if (t < on) continue; const y = f * FH + 18, p = P(c, -X + 55 + i * 110 + sway(y), y, -Z + 55 + j * 110); if (!p) continue;
    const red = t > sg, pop = imp(t, [[on, 1]]);
    circ(p.x, p.y, (6 + pop * 18) * p.s * 1.6, { fill: red ? RED : INK, glow: red ? 24 : 10 });
    if (red && t < sg + 0.9) { const k = (t - sg) / 0.9, top = P(c, -X + 55 + i * 110, y + 1600 * eo(k), -Z + 55 + j * 110); if (top) line(p.x, p.y, top.x, top.y, RED, 3, 1 - k); }
  }
  slam("TREMOR", W / 2, H / 2 - 120, t, 0.2, 2.5, { size: 300, glow: 20 });
  slam("MESH", W / 2, H / 2 + 150, t, 0.55, 2.5, { size: 300, col: RED, glow: 40 });
  slam("1 FLAT = 1 PHONE", W / 2, 150, t, 5.1, 8.3, { size: 120 });
  slam("EVERY FLAT", W / 2, 150, t, 11.0, 15.2, { size: 170 });
  slam("SIGNS IT.", W / 2, H - 140, t, 11.9, 15.2, { size: 210, col: RED, glow: 40 });
  return fxOf(t, [[0.2, 1.2], [0.55, 1.4], [5.1, 0.6], [8.45, 2.4], [11, 1], [11.9, 1.4]], { shake: imp(t, [[0.2, 1], [0.55, 1], [8.45, 2]]) * 26 + q * 14, red: imp(t, [[8.45, 0.35]]), zoom: 1 + q * 0.03 });
}};

// 3. WAVE: stomp → a shockwave rolls through a 3D floor grid → light pillars → 1, 2, 3 → CONFIRMED; then a lone shake
S.wave = { dur: 18, draw(t) {
  clear();
  const ts = 2.4, v = 700, tl = 11.0;
  const ph = [{ r: 245, a: 0.4 }, { r: 490, a: 2.5 }, { r: 770, a: 4.5 }, { r: 400, a: 1.3, held: true }].map((p) => ({ ...p, x: Math.cos(p.a) * p.r, z: Math.sin(p.a) * p.r, th: ts + p.r / v }));
  const conf = ph[2].th;
  const c = cam(-0.6 + t * 0.11, 0.92 - ss(9.4, 11, t) * 0.25, 1750 - ss(9.4, 11, t) * 400, 1400, [0, 0, 0], W * 0.44, H * 0.56);
  const disp = (x, z) => {
    let y = 0; if (t > ts) { const a = t - ts, r = Math.hypot(x, z), f = r - v * a; y += 75 * Math.exp(-f * f / (2 * 70 * 70)) * Math.exp(-a * 0.45) * Math.cos(f * 0.045); }
    if (t > tl) { const a = t - tl, r = Math.hypot(x - ph[0].x, z - ph[0].z); y += 26 * Math.exp(-r / 120) * Math.sin(a * 40) * Math.exp(-a * 0.8); }
    return y;
  };
  const N = 22, Sg = 1000;
  for (let i = 0; i <= N; i++) { const a = [], b = []; const u = -Sg + (2 * Sg * i) / N; for (let j = 0; j <= 50; j++) { const w = -Sg + (2 * Sg * j) / 50; a.push([u, disp(u, w), w]); b.push([w, disp(w, u), u]); } const hot = t > ts && t < ts + 2.5; poly3(c, a, hot ? "#6b6b6b" : "#333", 1.5, 0.9); poly3(c, b, hot ? "#6b6b6b" : "#333", 1.5, 0.9); }
  const fade2 = 1 - ss(9.4, 10.0, t);
  const o = P(c, 0, 0, 0); if (o && t > ts - 0.3 && t < ts + 1.2) circ(o.x, o.y, 30 * o.s * (1 + imp(t, [[ts, 3]])), { fill: INK, glow: 30, a: 1 - ss(ts + 0.6, ts + 1.2, t) });
  ph.forEach((p, i) => {
    let h = 0, col = INK, tilt = 0;
    if (t > p.th) h = 380 * eob((t - p.th) / 0.35) * fade2;
    if (!p.held && t > conf) col = RED;
    if (p.held) { col = DIM; tilt = 90 + Math.sin(t * 4) * 40; h *= 0.7; }
    if (i === 0 && t > tl) { h = 220 * eob((t - tl) / 0.3) * (1 - ss(15.6, 16.4, t)); col = DIM; tilt = Math.sin(t * 50) * 30; }
    const b = P(c, p.x, disp(p.x, p.z), p.z); if (!b) return; circ(b.x, b.y, 12 * b.s * 1.5, { fill: col, glow: 18, a: 0.9 });
    if (h > 1) { const top = P(c, p.x + tilt, h, p.z); if (!top) return; line(b.x, b.y, top.x, top.y, col, 26 * b.s, 0.25); line(b.x, b.y, top.x, top.y, col, 7 * b.s, 1); circ(top.x, top.y, 14 * top.s * 1.4, { fill: col, glow: 30 }); if (p.held && fade2 > 0.5) T("✕ HANDLED", top.x, top.y - 40, { f: MONO, w: 700, size: 24, col: DIM }); }
  });
  slam("STOMP.", W * 0.44, 150, t, ts - 0.05, ts + 1.4, { size: 150 });
  const nx = W - 300;
  [0, 1, 2].forEach((i) => slam(String(i + 1), nx, H / 2 - 40, t, ph[i].th, i < 2 ? ph[i + 1].th : 9.6, { size: 460, col: i === 2 ? RED : INK, glow: i === 2 ? 50 : 10 }));
  if (t > ph[0].th && t < 9.6) T("OF 3", nx, H / 2 + 220, { size: 70, col: t > conf ? RED : MUTE, a: 1 - ss(9.3, 9.6, t) });
  slam("CONFIRMED.", W * 0.44, H - 130, t, conf + 0.35, 9.6, { size: 200, col: RED, glow: 50 });
  slam("1", nx, H / 2 - 40, t, tl + 0.1, 16.4, { size: 460, col: DIM });
