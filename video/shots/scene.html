<!doctype html>
<!-- A code-built scene for frames.mjs: everything on screen is a pure function of time t.
     node ~/.claude/skills/demo-video/scripts/frames.mjs scene.html my-scene --dur 6 --blur 4 [--timing cut/timing.json]
     Rules: no Math.random() without a seed, no Date.now(), no requestAnimationFrame loops - draw only in renderFrame(t). -->
<html><head><meta charset="utf-8"><title>scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f1f3f4}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
window.sceneReady = false;
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#e8eaed"); scene.fog = new THREE.Fog("#e8eaed", 60, 140);
const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 400);
scene.add(new THREE.HemisphereLight("#ffffff", "#c9ccd1", 1.1));
const sun = new THREE.DirectionalLight("#ffffff", 1.6); sun.position.set(30, 50, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60 }); scene.add(sun);

// seeded random so every render is identical
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3));
const back = (x) => { if (x <= 0) return 0; if (x >= 1) return 1; const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// ground + a grid of streets with buildings that rise in a radial wave
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: "#ffffff" }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const buildings = [];
const mTop = new THREE.MeshStandardMaterial({ color: "#f8f9fa" }), mSide = new THREE.MeshStandardMaterial({ color: "#d4d7dc" });
for (let gx = -6; gx <= 6; gx++) for (let gz = -6; gz <= 6; gz++) {
  if (rnd() < 0.12) continue;
  const h = 1 + rnd() * 7, w = 3 + rnd() * 1.4, d = 3 + rnd() * 1.4;
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, 1, d), [mSide, mSide, mTop, mSide, mSide, mSide]);
  b.position.set(gx * 6, 0, gz * 6); b.castShadow = b.receiveShadow = true;
  b.userData = { h, delay: Math.hypot(gx, gz) * 0.07 }; scene.add(b); buildings.push(b);
}
// the blue route: a path along the streets that draws itself on
const pts = [[-39, 3], [-3, 3], [-3, -21], [21, -21], [21, 27]].map(([x, z]) => new THREE.Vector3(x, 0.15, z));
const curve = new THREE.CatmullRomCurve3(pts, false, "catmullrom", 0.05);
const route = new THREE.Mesh(new THREE.TubeGeometry(curve, 400, 0.45, 12), new THREE.MeshStandardMaterial({ color: "#1a73e8", emissive: "#1a73e8", emissiveIntensity: 0.4 }));
scene.add(route);
const dot = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 16), new THREE.MeshStandardMaterial({ color: "#1a73e8", emissive: "#4285f4", emissiveIntensity: 0.6 }));
const ring = new THREE.Mesh(new THREE.RingGeometry(1.2, 1.6, 48), new THREE.MeshBasicMaterial({ color: "#4285f4", transparent: true, side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI / 2; scene.add(dot, ring);

// optional: sync to the voice via timing.json (window.TIMING) - e.g. reveal the city on the first spoken word
const T = window.TIMING; const reveal = T?.words?.[0]?.t0 ?? 0.6;

window.renderFrame = (t) => {
  for (const b of buildings) { const k = back((t - reveal - b.userData.delay) / 0.8); b.scale.y = Math.max(0.001, k * b.userData.h); b.position.y = b.scale.y / 2; }
  const draw = ease((t - reveal - 0.6) / 3.5);
  route.geometry.setDrawRange(0, Math.floor(route.geometry.index.count * draw / 3) * 3);
  const p = curve.getPointAt(Math.min(0.999, Math.max(0.001, draw)));
  dot.position.set(p.x, 1.1 + 0.15 * Math.sin(t * 6), p.z); ring.position.set(p.x, 0.2, p.z);
  const pulse = (t * 1.2) % 1; ring.scale.setScalar(1 + pulse * 1.6); ring.material.opacity = 0.6 * (1 - pulse);
  const a = -0.6 + t * 0.12, r = 46 - 12 * ease(t / 6);
  cam.position.set(p.x * 0.4 + Math.cos(a) * r, 78 - 18 * ease(t / 6), p.z * 0.4 + Math.sin(a) * r);
  cam.lookAt(p.x * 0.6, 0, p.z * 0.6);
  renderer.render(scene, cam);
};
window.renderFrame(0);
window.sceneReady = true;
</script></body></html>
