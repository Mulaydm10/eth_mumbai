<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@700&display=swap">
<style>
html,body{margin:0;width:1920px;height:1080px;background:#050505;overflow:hidden}
#stage{position:absolute;inset:0;transform-origin:50% 50%}
.card{position:absolute;background:#fff;padding:18px 22px;box-shadow:0 30px 60px rgba(0,0,0,.65);opacity:0;
 clip-path:polygon(0 2%,6% 0,14% 1.5%,22% 0,31% 2%,40% .5%,52% 2%,63% 0,74% 1.8%,85% .3%,94% 2%,100% .5%,100% 98%,93% 100%,84% 98.4%,73% 100%,62% 98%,50% 99.6%,39% 98%,27% 100%,16% 98.2%,7% 100%,0 98.5%)}
.card img{display:block;width:100%}
.tag{position:absolute;opacity:0;font:700 24px 'JetBrains Mono',monospace;letter-spacing:3px;color:#fff;background:#e63946;padding:6px 14px}
#line{position:absolute;left:0;right:0;top:905px;text-align:center;font:400 78px 'Anton',Impact,sans-serif;letter-spacing:1px;color:#f5f5f3;opacity:0}
#line b{color:#e63946;font-weight:400}
</style></head><body><div id="stage">
<div class="card" id="k1" style="left:120px;top:120px;width:1180px"><img src="c1.png"></div><div class="tag" id="t1" style="left:120px;top:76px">THE ASIAN AGE</div>
<div class="card" id="k2" style="left:780px;top:300px;width:1000px"><img src="c2.png"></div><div class="tag" id="t2" style="left:780px;top:256px">FREE PRESS JOURNAL</div>
<div class="card" id="k3" style="left:170px;top:470px;width:760px"><img src="c3.png"></div><div class="tag" id="t3" style="left:170px;top:426px">MUMBAI LIVE</div>
<div id="line">REAL CASES. REAL BUILDINGS. <b>MUMBAI.</b></div></div>
<script>
// Real headlines from the three source articles (outlet names only, no dates). Pure function of t for frames.mjs.
const cl = (x) => Math.min(1, Math.max(0, x)), eo = (x) => 1 - Math.pow(1 - cl(x), 3);
const K = [["k1", "t1", 0.5, -2.2], ["k2", "t2", 2.1, 1.6], ["k3", "t3", 3.7, -1.4]];
window.sceneReady = false;
Promise.all([...document.images].map((i) => i.decode()).concat([document.fonts.ready])).then(() => (window.sceneReady = true));
window.renderFrame = async (t) => {
  document.getElementById("stage").style.transform = `scale(${1 + t * 0.006})`;
  for (const [k, tg, t0, rot] of K) {
    const u = eo((t - t0) / 0.45), el = document.getElementById(k);
    el.style.opacity = u; el.style.transform = `translateY(${(1 - u) * -60}px) rotate(${rot + (1 - u) * 6}deg) scale(${1.25 - 0.25 * u})`;
    const tag = document.getElementById(tg); tag.style.opacity = cl((t - t0 - 0.35) / 0.25); tag.style.transform = `rotate(${rot}deg)`;
  }
  const l = cl((t - 5.4) / 0.4); const ln = document.getElementById("line"); ln.style.opacity = l; ln.style.transform = `scale(${1.15 - 0.15 * eo((t - 5.4) / 0.4)})`;
};
</script></body></html>
