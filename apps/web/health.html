<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Tremor Mesh · Health</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="wide">
      <header>
        <h1>Tremor Mesh · Health</h1>
        <p class="sub">Live checks against each sponsor stack, run in your browser against public endpoints (read-only, no server of ours). <a href="/dashboard.html" id="dashLink">dashboard →</a></p>
      </header>
      <section class="card controls">
        <label class="label" for="site">Site</label><input id="site" class="input" />
        <button id="run" class="ghost">Run checks</button>
        <span id="summary" class="small muted">–</span>
      </section>
      <section class="card">
        <table><thead><tr><th>Stack</th><th>Check</th><th>Result</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table>
      </section>
    </main>
    <script type="module" src="/src/health.ts"></script>
  </body>
</html>
