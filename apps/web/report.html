<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tremor Mesh · Evidence report</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      .report { max-width: 820px; }
      .report h2 { font-size: 17px; margin: 20px 0 8px; }
      .kv { display: grid; grid-template-columns: 200px 1fr; gap: 6px 14px; font-size: 14px; }
      .kv div:nth-child(odd) { color: var(--muted); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; }
      .claim { border-left: 3px solid var(--accent); padding: 8px 12px; background: rgba(242, 165, 65, 0.08); }
      ol.steps li { margin: 6px 0; }
      .noprint { margin: 12px 0; }
      @media print {
        :root { --bg: #fff; --card: #fff; --line: #ccc; --text: #111; --muted: #555; --accent: #a35f00; --ok: #0a7a43; --warn: #b3261e; }
        body { background: #fff; }
        .noprint { display: none; }
        a { color: #111; }
      }
    </style>
  </head>
  <body>
    <main class="report">
      <header>
        <h1>Vibration evidence report</h1>
        <p class="sub" id="subtitle">Loading from Arkiv, Swarm and ENS…</p>
      </header>
      <div class="noprint"><button id="print" class="primary" style="width:auto;padding:10px 16px">Print / save as PDF</button></div>
      <section class="card" id="body"><p class="muted">Loading…</p></section>
    </main>
    <script type="module" src="/src/report.ts"></script>
  </body>
</html>
